version: '3.8'

services:
  voice-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voice_agent_honeypot
    restart: always
    ports:
      - "8080:8080"
    environment:
      # Provider Selection (mock | deepgram | groq | openai | elevenlabs)
      - STT_PROVIDER=${STT_PROVIDER:-mock}
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - TTS_PROVIDER=${TTS_PROVIDER:-mock}

      # API Keys (Set in .env file)
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY:-}
      - DEEPGRAM_MODEL=${DEEPGRAM_MODEL:-nova-2}
      
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_LLM_MODEL=${GROQ_LLM_MODEL:-llama-3.3-70b-versatile}
      
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID:-21m00Tcm4TlvDq8ikWAM}
      - ELEVENLABS_MODEL_ID=${ELEVENLABS_MODEL_ID:-eleven_flash_v2_5}
      
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}

      # Optional API Key Authentication for WebSockets & Webhooks
      - VOICE_API_KEY=${VOICE_API_KEY:-}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
